name: Security Rules Tests

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: npm run check:js

      - name: Test Firestore authorization
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:rules 2>&1 | tee firestore-rules-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Keep emulator failures visible through the Checks API even when a
            # sandbox cannot download the normal Actions log archive.
            message=$(tail -c 6000 firestore-rules-test.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Firestore rules test failure::$message"
          fi
          exit "$status"
