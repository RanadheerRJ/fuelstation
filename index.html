<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2535" />
  <meta name="description" content="FuelOps - Fuel Station Operations with Human Kind - Owner & Attendant Handshake" />
  <title>FuelOps - Fuel Station Operations</title>

  <!-- PWA Manifest - relative path for GitHub Pages subpath support -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

  <!-- Styles - relative -->
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/ui-polish.css" />

  <!-- Importmap for Firebase CDN + relative modules -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">⚠️ You're offline. Some features may not work.</div>
  <div class="update-banner" id="updateBanner" style="display:none">
    ✨ A new version is available.
    <button id="updateReloadBtn" type="button">Refresh Now</button>
  </div>

  <div class="app-shell">
    <header class="topbar" id="topbar" style="display:none">
      <div class="brand"><div class="brand-mark" style="background:transparent;padding:0;overflow:hidden"><img src="./assets/icons/icon-72.png" alt="FuelOps" style="width:36px;height:36px;border-radius:10px;object-fit:cover"></div> FuelOps</div>
      <div class="top-actions">
        <span id="stationBadge" class="badge badge--neutral" style="display:none"></span>
        <button id="refreshTop" class="neu-btn neu-btn--small" style="display:none" title="Refresh">↻</button>
        <button id="logoutTop" class="neu-btn neu-btn--small" style="display:none">Logout</button>
      </div>
    </header>

    <main id="appRoot"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <!-- Filled dynamically by JS based on role -->
  </nav>

  <!-- App entry -->
  <script type="module" src="./js/app.js"></script>

  <!-- Service Worker registration - relative scope for GitHub Pages -->
  <!-- Detects when a new version has been deployed and prompts the user to refresh,
       instead of silently getting stuck on old cached code (see docs/PWA_UPDATES.md). -->
  <script>
    if ('serviceWorker' in navigator) {
      const banner = document.getElementById('updateBanner');
      const reloadBtn = document.getElementById('updateReloadBtn');
      let refreshing = false;
      let waitingWorker = null;

      function showUpdateBanner(worker) {
        waitingWorker = worker;
        banner.style.display = 'flex';
      }

      reloadBtn.addEventListener('click', () => {
        if (waitingWorker) {
          waitingWorker.postMessage('SKIP_WAITING');
        } else {
          location.reload();
        }
      });

      // When the new SW takes control, reload once to load the fresh page
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' })
          .then(reg => {
            console.log('SW registered', reg.scope);

            // A worker was already waiting when we loaded (e.g. update happened in background tab)
            if (reg.waiting) showUpdateBanner(reg.waiting);

            // Watch for a brand-new worker being found (new deploy) and installed
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // There's an existing controller, so this is an UPDATE, not first install
                  showUpdateBanner(newWorker);
                }
              });
            });

            // Proactively ask the browser to check for a new SW file periodically
            // (GitHub Pages users often keep tabs open for hours/days)
            setInterval(() => reg.update().catch(()=>{}), 60 * 60 * 1000); // hourly
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(()=>{});
            });
          })
          .catch(err => console.warn('SW failed', err));
      });
    }
  </script>
</body>
</html>
