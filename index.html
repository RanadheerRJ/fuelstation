<!DOCTYPE html>

  <meta name="theme-color" content="#1a2535" />
  <meta name="description" content="FuelOps - Fuel Station Operations with Human Kind - Owner & Attendant Handshake" />
  <title>FuelOps - Fuel Station Operations</title>

  <!-- PWA Manifest - relative path for GitHub Pages subpath support -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

  <!-- Styles - relative -->
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Importmap for Firebase CDN + relative modules -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">⚠️ You're offline. Some features may not work.</div>

  <div class="app-shell">
    <header class="topbar" id="topbar" style="display:none">
      <div class="brand"><div class="brand-mark" style="background:transparent;padding:0;overflow:hidden"><img src="./assets/icons/icon-72.png" alt="FuelOps" style="width:36px;height:36px;border-radius:10px;object-fit:cover"></div> FuelOps</div>
      <div class="top-actions">
        <span id="stationBadge" class="badge badge--neutral" style="display:none"></span>
        <button id="refreshTop" class="neu-btn neu-btn--small" style="display:none" title="Refresh">↻</button>
        <button id="logoutTop" class="neu-btn neu-btn--small" style="display:none">Logout</button>
      </div>
    </header>

    <main id="appRoot"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <!-- Filled dynamically by JS based on role -->
  </nav>

  <!-- App entry -->
  <script type="module" src="./js/app.js"></script>

  <!-- Service Worker registration - relative scope for GitHub Pages -->
  <script>
    // Service worker registration.
    //
    // Devices were getting stuck on old UI because the worker served cached
    // code without ever consulting the network. The worker is now
    // network-first; this side makes sure a new worker is noticed promptly
    // and that the page reloads itself once one takes over.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          // updateViaCache:'none' stops the browser serving service-worker.js
          // itself from its HTTP cache - otherwise a new version can go
          // unnoticed for up to 24h.
          .register('./service-worker.js', { scope: './', updateViaCache: 'none' })
          .then(reg => {
            // Check for a new version on load, when the tab regains focus,
            // and hourly for long-lived sessions.
            const check = () => reg.update().catch(() => {});
            check();
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') check();
            });
            setInterval(check, 60 * 60 * 1000);

            // If a new worker is waiting, activate it straight away.
            const promote = (sw) => {
              if (!sw) return;
              sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  sw.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            };
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            promote(reg.installing);
            reg.addEventListener('updatefound', () => promote(reg.installing));
          })
          .catch(err => console.warn('SW failed', err));

        // Reload once when a new worker takes control, so the user lands on
        // the new code without being told to clear their cache. Guarded so a
        // repeated controller change cannot loop.
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
