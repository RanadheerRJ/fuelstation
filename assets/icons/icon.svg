<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PumpPulse">
  <!-- PumpPulse — a fuel droplet with a live pulse line running through it.
       Content is kept inside the ~80% safe circle so the PWA maskable crop is clean. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2c3f"/>
      <stop offset="100%" stop-color="#131c29"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ff9057"/>
      <stop offset="100%" stop-color="#ff5a1f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Droplet -->
  <path d="M256 116
           C 256 116, 366 230, 366 310
           a 110 110 0 0 1 -220 0
           C 146 230, 256 116, 256 116 Z"
        fill="url(#drop)"/>

  <!-- Soft highlight -->
  <path d="M208 232 C 190 264, 185 292, 189 314"
        stroke="#ffffff" stroke-opacity="0.32" stroke-width="14"
        stroke-linecap="round" fill="none"/>

  <!-- Pulse / ECG line -->
  <path d="M170 312 H 218 L 239 264 L 270 356 L 293 312 H 342"
        stroke="#ffffff" stroke-width="23"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
